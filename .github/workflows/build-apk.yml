name: Compilar APK X-pertfood

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirmar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar nome do APK
        run: cp app/build/outputs/apk/debug/app-debug.apk X-pertfood-v1.0.1.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: X-pertfood-v1.0.1
          path: X-pertfood-v1.0.1.apk
          retention-days: 30
