name: Compilar APK X-pertfood

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar nome do APK
        run: cp app/build/outputs/apk/debug/app-debug.apk X-pertfood-v1.0.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: X-pertfood-v1.0.0
          path: X-pertfood-v1.0.0.apk
          retention-days: 30
